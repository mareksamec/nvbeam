name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.0-rc1)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Tag-push runs use the pushed tag; manual runs use the tag input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ qt6-base-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package DEB
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake gcc-c++ rpm-build \
            qt6-qtbase-devel mesa-libGL-devel

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package RPM
        run: cd build && cpack -G RPM

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/*.rpm

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - uses: actions/checkout@v4

      - name: Prepare source tarball from checkout
        run: |
          # The repo is private, so makepkg cannot re-download the source from
          # the GitHub archive URL (unauthenticated curl -> 404). Instead build
          # from the checkout: set pkgver from the tag and pack the tree into the
          # local tarball the PKGBUILD expects (prefix must match ${pkgname}-${pkgver}).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkgver="${RELEASE_TAG#v}"       # "v0.1.1" -> "0.1.1"
          pkgver="${pkgver//-/_}"         # makepkg forbids hyphens in pkgver ("0.2.0-rc1" -> "0.2.0_rc1")
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" packaging/arch/PKGBUILD
          git archive --format=tar.gz \
            --prefix="neobeam-${pkgver}/" \
            -o "packaging/arch/neobeam-${pkgver}.tar.gz" HEAD

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root; give a normal user passwordless
          # pacman via sudo so it can install makedepends. chown AFTER the tarball
          # exists so builder owns it and can read it / write the package alongside.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        working-directory: packaging/arch
        run: sudo -u builder makepkg -s --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  release:
    needs: [build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On manual runs the tag doesn't exist yet — create it at the
          # dispatched commit. On tag pushes the existing tag is reused
          # and target_commitish is ignored.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            *.deb
            *.rpm
            *.pkg.tar.zst
