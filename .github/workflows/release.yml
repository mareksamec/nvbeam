name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.0-rc1)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Tag-push runs use the pushed tag; manual runs use the tag input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # project() in CMakeLists.txt is the single source of the version the
  # binaries and the deb/rpm artifacts carry, while the Arch package and the
  # release name come from the tag. Releasing a tag that disagrees with it
  # ships artifacts named after the wrong version, so stop before building.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches project() version
        run: |
          project=$(sed -n 's/^project(nvbeam VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag="${RELEASE_TAG#v}"          # "v0.2.8" -> "0.2.8"
          tag="${tag%%-*}"                # "0.2.8-rc1" -> "0.2.8"
          echo "project()=${project} tag=${tag}"
          if [[ "${project}" != "${tag}" ]]; then
            echo "::error::CMakeLists.txt project() version ${project} does not match tag ${RELEASE_TAG}. Bump project() first."
            exit 1
          fi

  build-deb:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev libgl1-mesa-dev
          # KF6 build of the syntax library; absent before Ubuntu 25.04, and
          # without it the deb is built without code coloring in review diffs.
          sudo apt-get install -y libkf6syntaxhighlighting-dev || \
          echo "libkf6syntaxhighlighting-dev not available - deb without code coloring"

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package DEB
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb

  build-rpm:
    needs: check-version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake gcc-c++ rpm-build \
            qt6-qtbase-devel mesa-libGL-devel kf6-syntax-highlighting-devel

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package RPM
        run: cd build && cpack -G RPM

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/*.rpm

  build-arch:
    needs: check-version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo pacman-contrib

      - uses: actions/checkout@v4

      - name: Set pkgver from the tag
        run: |
          # The PKGBUILD downloads the tag's GitHub archive, so only the version
          # has to be filled in. makepkg forbids hyphens in pkgver, hence the
          # substitution ("0.2.0-rc1" -> "0.2.0_rc1"); the source URL keeps the
          # original tag spelling via ${pkgver//_/-}.
          pkgver="${RELEASE_TAG#v}"       # "v0.1.1" -> "0.1.1"
          pkgver="${pkgver//-/_}"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" packaging/arch/PKGBUILD

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root; give a normal user passwordless
          # pacman via sudo so it can install makedepends, and let it own the
          # checkout so it can write the downloaded source and the package there.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        working-directory: packaging/arch
        run: |
          # updpkgsums fills in the tag archive's checksum, which cannot be known
          # before the tag is pushed.
          sudo -u builder updpkgsums
          sudo -u builder makepkg -s --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  release:
    needs: [build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # On manual runs the tag doesn't exist yet — create it at the
          # dispatched commit. On tag pushes the existing tag is reused
          # and target_commitish is ignored.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            *.deb
            *.rpm
            *.pkg.tar.zst
