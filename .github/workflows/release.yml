name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ qt6-base-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package DEB
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake gcc-c++ rpm-build \
            qt6-qtbase-devel mesa-libGL-devel

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package RPM
        run: cd build && cpack -G RPM

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/*.rpm

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - uses: actions/checkout@v4

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root; give a normal user passwordless
          # pacman via sudo so it can install makedepends.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Set package version from tag
        run: |
          # GITHUB_REF_NAME is the tag, e.g. "v0.1.0" -> pkgver "0.1.0".
          pkgver="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" packaging/arch/PKGBUILD

      - name: Build package
        working-directory: packaging/arch
        run: sudo -u builder makepkg -s --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  release:
    needs: [build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.deb
            *.rpm
            *.pkg.tar.zst
