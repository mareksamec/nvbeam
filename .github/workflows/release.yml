name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.0-rc1)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Tag-push runs use the pushed tag; manual runs use the tag input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Queue releases one at a time per tag. Not cancel-in-progress: killing a run
# midway could leave a half-published release.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # project() in CMakeLists.txt is the single source of the version the
  # binaries and the deb/rpm artifacts carry, while the Arch package and the
  # release name come from the tag. Releasing a tag that disagrees with it
  # ships artifacts named after the wrong version, so stop before building.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches project() version
        run: |
          project=$(sed -n 's/^project(nvbeam VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag="${RELEASE_TAG#v}"          # "v0.2.8" -> "0.2.8"
          tag="${tag%%-*}"                # "0.2.8-rc1" -> "0.2.8"
          echo "project()=${project} tag=${tag}"
          if [[ "${project}" != "${tag}" ]]; then
            echo "::error::CMakeLists.txt project() version ${project} does not match tag ${RELEASE_TAG}. Bump project() first."
            exit 1
          fi

  build-deb:
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev libgl1-mesa-dev
          # KF6 build of the syntax library; absent before Ubuntu 25.04, and
          # without it the deb is built without code coloring in review diffs.
          sudo apt-get install -y libkf6syntaxhighlighting-dev || \
          echo "libkf6syntaxhighlighting-dev not available - deb without code coloring"

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package DEB
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: build/*.deb

  build-rpm:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake gcc-c++ rpm-build \
            qt6-qtbase-devel mesa-libGL-devel kf6-syntax-highlighting-devel

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package RPM
        run: cd build && cpack -G RPM

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: build/*.rpm

  build-arch:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo pacman-contrib

      - uses: actions/checkout@v7

      - name: Set pkgver from the tag
        run: |
          # The PKGBUILD downloads the tag's GitHub archive, so only the version
          # has to be filled in. makepkg forbids hyphens in pkgver, hence the
          # substitution ("0.2.0-rc1" -> "0.2.0_rc1"); the source URL keeps the
          # original tag spelling via ${pkgver//_/-}.
          pkgver="${RELEASE_TAG#v}"       # "v0.1.1" -> "0.1.1"
          pkgver="${pkgver//-/_}"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" packaging/arch/PKGBUILD

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root; give a normal user passwordless
          # pacman via sudo so it can install makedepends, and let it own the
          # checkout so it can write the downloaded source and the package there.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        working-directory: packaging/arch
        run: |
          # updpkgsums fills in the tag archive's checksum, which cannot be known
          # before the tag is pushed.
          sudo -u builder updpkgsums
          sudo -u builder makepkg -s --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  release:
    needs: [build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # On manual runs the tag doesn't exist yet — create it at the
          # dispatched commit. On tag pushes the existing tag is reused
          # and target_commitish is ignored.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            *.deb
            *.rpm
            *.pkg.tar.zst

  # Bump the nvbeam-bin AUR package to the release just published. The package
  # repackages the Arch package attached to the release, so this runs after the
  # release job, and only for stable releases: not for "-rc" tags or manual runs
  # marked as pre-release.
  # Needs the AUR_SSH_PRIVATE_KEY secret: the private half of an SSH key whose
  # public half is added to the AUR maintainer account.
  publish-aur-bin:
    needs: release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') && !inputs.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:latest
    env:
      AUR_PACKAGE: nvbeam-bin
      AUR_COMMIT_NAME: Marek Samec
      AUR_COMMIT_EMAIL: samec.marek@gmail.com
      # Pinned host key of aur.archlinux.org (Ed25519,
      # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as listed on the
      # AUR home page). If the AUR ever rotates it, the push fails here instead
      # of trusting an unknown host.
      AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh pacman-contrib

      - uses: actions/checkout@v7

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Update PKGBUILD to the release
        working-directory: packaging/aur/${{ env.AUR_PACKAGE }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${RELEASE_TAG#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # updpkgsums downloads the release asset and pins its checksum.
          sudo -u builder updpkgsums
          # Build once without installing dependencies (-d) to prove package()
          # still matches the asset's layout before anything is pushed.
          sudo -u builder makepkg -d --noconfirm
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::error::The AUR_SSH_PRIVATE_KEY secret is not set."
            exit 1
          fi

          # Explicit paths: in a container job HOME is not root's home, so ssh
          # would not find files under ~/.ssh.
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          mkdir -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$AUR_HOST_KEY" > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"

          # Cloning a package that does not exist yet gives an empty repo, and
          # the push below creates the package.
          aur_dir="$RUNNER_TEMP/aur-repo"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" "$aur_dir"
          cp "packaging/aur/${AUR_PACKAGE}/PKGBUILD" "packaging/aur/${AUR_PACKAGE}/.SRCINFO" "$aur_dir/"

          cd "$aur_dir"
          git config user.name "$AUR_COMMIT_NAME"
          git config user.email "$AUR_COMMIT_EMAIL"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR ${AUR_PACKAGE} is already at ${RELEASE_TAG#v}, nothing to push."
            exit 0
          fi
          git commit -m "Update to ${RELEASE_TAG#v}"
          # The AUR only accepts pushes to master.
          git push origin HEAD:master
