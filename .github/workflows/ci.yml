name: CI

# Files that cannot affect the build or tests: docs, task notes, packaging
# recipes (built by the Release workflow), sample configs and repo metadata.
# Changes touching only these skip CI to save Actions minutes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tasks/**'
      - 'packaging/**'
      - 'LICENSE'
      - 'nvbeam.toml'
      - 'nvbeam.toml.example'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/workflows/openbsd.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tasks/**'
      - 'packaging/**'
      - 'LICENSE'
      - 'nvbeam.toml'
      - 'nvbeam.toml.example'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/workflows/openbsd.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# A push to a pull request branch supersedes the run already going for it; the
# matrix is several minutes of runner time per push, so cancel the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Merging a PR pushes a "Merge pull request" commit to main; the PR run
    # already built and tested that code, so skip it. Direct pushes still build.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            terminal: ON
          - os: ubuntu-22.04
            terminal: OFF

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            qt6-base-dev \
            libgl1-mesa-dev

      - name: Install KF6SyntaxHighlighting (if available)
        run: |
          # Absent before Ubuntu 25.04; the build then falls back to plain
          # diff coloring, which is a supported configuration.
          sudo apt-get install -y libkf6syntaxhighlighting-dev || \
          echo "libkf6syntaxhighlighting-dev not available - building without code coloring"

      - name: Install qtermwidget6 (if available)
        if: matrix.terminal == 'ON'
        run: |
          sudo apt-get install -y qtermwidget6-dev || \
          sudo apt-get install -y libqtermwidget6-1-dev || \
          echo "qtermwidget6 not available — building without terminal"

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DNVBEAM_TERMINAL=${{ matrix.terminal }} -DNVBEAM_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  build-fedora:
    # Merging a PR pushes a "Merge pull request" commit to main; the PR run
    # already built and tested that code, so skip it. Direct pushes still build.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y \
            git \
            cmake \
            gcc-c++ \
            qt6-qtbase-devel \
            mesa-libGL-devel \
            kf6-syntax-highlighting-devel \
            qtermwidget

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNVBEAM_TERMINAL=ON -DNVBEAM_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  build-arch:
    # Merging a PR pushes a "Merge pull request" commit to main; the PR run
    # already built and tested that code, so skip it. Direct pushes still build.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            make \
            gcc \
            qt6-base \
            syntax-highlighting \
            qtermwidget

      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNVBEAM_TERMINAL=ON -DNVBEAM_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
