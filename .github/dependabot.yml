version: 2
updates:
  # The workflows pin third-party actions; this keeps those pins current instead
  # of leaving them to drift until something breaks at release time.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    # One pull request for the lot. There are only a handful of actions here and
    # they are updated together anyway, so a PR per action is noise - and the
    # artifact upload/download pair in particular should move in step.
    groups:
      actions:
        patterns:
          - "*"
