name: Feature request
description: Suggest a capability nvbeam does not have yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check `PROJECT.md` (roadmap and design decisions) and
        `tasks/completed/` first - the idea may already be planned, or already
        have been tried and rejected for a stated reason.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that nvbeam makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead, from a user's point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing settings, Neovim plugins or workarounds you tried, and why they fall short.
